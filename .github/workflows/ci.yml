# Pull requests: run tests and verify Docker image builds (linux/amd64 + linux/arm64, no push).
# Push to master: run tests, then push multi-arch image to Docker Hub and create a GitHub Release
# with kustomize-built kwok-operator.yaml.
#
# Required repository secrets (push to master / release job only):
#   DOCKERHUB_USERNAME — Docker Hub username
#   DOCKERHUB_TOKEN    — Docker Hub access token (recommended) or password
#
# Release version and image tag are read from Makefile: VERSION ?= x.y.z
# Bump VERSION (and optionally config/manager/kustomization.yaml newTag) before merging
# when you want a new release; duplicate tags will fail at gh release create.

name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  IMAGE: docker.io/runaidevops/kwok-operator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: make test

  # Multi-platform images cannot be loaded locally without a registry push; PRs build each
  # platform separately so Buildx still compiles the Dockerfile for amd64 and arm64.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache_scope: amd64
          - platform: linux/arm64
            cache_scope: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: kwok-operator:pr-check
          cache-from: type=gha,scope=docker-${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.cache_scope }}

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from Makefile
        id: version
        run: |
          VERSION=$(grep -E '^VERSION \?=' Makefile | head -1 | sed -E 's/^VERSION \?= //')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse VERSION from Makefile"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building and releasing ${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release manifest (kustomize)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          IMG="${IMAGE}:${VERSION}"
          make kustomize
          (cd config/manager && ../../bin/kustomize edit set image controller="${IMG}")
          bin/kustomize build config/default -o kwok-operator.yaml

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          gh release create "${VERSION}" \
            kwok-operator.yaml \
            --title "${VERSION}" \
            --generate-notes
